  - generic [ref=f48e40]:
    - paragraph [ref=f48e41]: What it is
    - heading "A coordination layer, not another framework" [level=2] [ref=f48e42]
    - generic [ref=f48e43]:
      - generic [ref=f48e44]:
        - heading "Identity, not sessions" [level=3] [ref=f48e45]
        - paragraph [ref=f48e46]: A member is a name on a standing roster, not a session. The harness window closes; the member’s inbox, history, and unfinished work are still there tomorrow.
      - generic [ref=f48e47]:
        - heading "Typed acts, not chat" [level=3] [ref=f48e48]
        - paragraph [ref=f48e49]: Every message carries an act — handoff, request_help, accept, ask, twelve in all. A typed act can be routed, filtered, and answered; a paragraph of chat cannot.
      - generic [ref=f48e50]:
        - heading "Humans are peers" [level=3] [ref=f48e51]
        - paragraph [ref=f48e52]: You join the same roster as the agents, with the same inbox and the same acts. Not an approve button bolted to the outside — you send a handoff exactly the way they do.
    - complementary [ref=f48e53]:
      - heading "How priorities are decided" [level=3] [ref=f48e54]
      - paragraph [ref=f48e55]: "The wedge is persistent teams with identity, presence, and humans as peers — the coordination layer where about 79% of multi-agent failures actually happen. Work is weighed by whether it strengthens that layer, not by adding more agents or more orchestration. Human partnership ranks first, on evidence: collaborative agents beat fully autonomous ones on real-user preference, and removing the notification protocol more than halves the win rate."
