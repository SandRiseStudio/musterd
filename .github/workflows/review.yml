# Automated PR review (ADR 180) — the cheap replacement for Cursor Bugbot.
#
# ADVISORY, NOT A GATE. This workflow must never be added to branch protection. Bugbot was a required
# check, so when its quota ran out every PR stalled with no way to land; a reviewer that depends on an
# external API has to be allowed to fail. It comments; `gates` decides.
#
# Scoped to the concurrency/state core (protocol + server src) — the ~22% of PRs where a reader can
# catch something the test suite cannot. Docs-only and web-only PRs are fully covered by `gates`.
name: review

on:
  pull_request:
    paths:
      - 'packages/protocol/src/**'
      - 'packages/server/src/**'

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    # Never let a review failure read as a broken build — this job is advisory by construction.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base branch present to diff against it.
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_BASE: origin/${{ github.base_ref }}
        run: |
          node --disable-warning=ExperimentalWarning scripts/review/pr-review.ts > review.md
          if [ -s review.md ]; then echo "has_findings=true" >> "$GITHUB_OUTPUT"; fi

      # One rolling comment per PR rather than a new one per push — the marker below is how we find
      # and update it, so a 30-commit branch leaves one comment, not thirty.
      - name: Post findings
        if: steps.review.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARKER='<!-- musterd-review -->'
          { echo "$MARKER"; echo '### Review findings'; echo; cat review.md; echo;
            echo '_Advisory only — a cheap single-pass model over `.github/REVIEW-RULES.md`. Not a merge gate; use judgement._'; } > body.md
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))] | .[0].id // empty")
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" -F body=@body.md
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md
          fi
