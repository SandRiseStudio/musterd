# The demo-audience load bench — deployed by hand, destroyed after the numbers are taken:
#
#   fly apps create musterd-loadbench
#   fly deploy -c scripts/perf/loadbench.fly.toml --remote-only
#   fly ssh console -a musterd-loadbench
#   cd /app && DAEMON_CPUS=0 taskset -c 1-7 node scripts/perf/demo-audience-load.mjs
#   fly apps destroy musterd-loadbench
#
# The tunnel leg (humans through the Cloudflare edge, agents/viewers loopback). The harness forks
# its own daemon, so start the tunnel first against the port the next run will bind:
#
#   taskset -c 1 cloudflared tunnel --url http://127.0.0.1:4851   # prints the quick-tunnel hostname
#   cd /app && PORT=4851 REMOTE_URL=https://<that-hostname> RAMP=650 \
#     DAEMON_CPUS=0 taskset -c 2-7 node scripts/perf/demo-audience-load.mjs
#
# RAMP ≥ 12s per human: the edge collapses every human onto this box's one IP, so arrivals must
# stay under the per-IP OAuth limits (register 5/min) — read arrival-burst numbers from a loopback
# run, where cf-connecting-ip is distinct per attendee. A quick tunnel is best-effort; label the
# numbers as quick-tunnel, or run the named tunnel from docs/operations/public-demo-tunnel.md.
#
# No services: nothing listens for the outside world. The box exists to be ssh'd into, so auto_stop
# is irrelevant and restart is never — its lifetime is the session's.
app = "musterd-loadbench"
primary_region = "sjc"

[build]
  dockerfile = "loadbench.Dockerfile"

[[vm]]
  size = "performance-8x"

[[restart]]
  policy = "never"
