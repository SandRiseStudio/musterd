<!doctype html>
<html>
<head><meta charset="utf-8"><title>opacity fixture</title>
<style>
  body { background: #ffffff; margin: 0; font: 16px sans-serif; }
  p { margin: 16px; color: #555555; }
  /* #555 on white is ~7.5:1 at full strength. Pinned at 0.55 it lands as ~#a2a2a2, ~2.6:1: a line a
     reader only ever sees faded. Graded at full strength, it passes, which is the defect (lane
     01M2NRPMPA). */
  #faded { opacity: 0.55; }
</style></head>
<body>
  <p id="faded">a line that is only ever seen faded</p>
  <p id="control">the same ink at full strength</p>
</body>
</html>
