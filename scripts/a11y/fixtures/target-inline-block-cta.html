<!--
  MUST FAIL, and it is the control for the gate's own worst failure mode rather than for the site's.

  This is /watch's button row reduced to its shape: two undersized inline-block anchors stacked
  flush against each other, in a section that also holds a heading and a paragraph of prose. Each
  one's 24px circle reaches the other's box, so the correct verdict is FAIL. The
  FIRST cut of the inline exception looked for text anywhere in the nearest block ancestor, found
  the paragraph, and exempted it — a gate reporting green about the single most important target on
  the page (measured 2026-09-21, lane 01M32HG5GJ).

  A CTA is a box that sits on a line, not a word in a sentence. If this file ever passes, the
  exception has drifted back to permissive and the gate is decorative — the prose above these two
  is there for no other reason than to bait it.
-->
