<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>target control — conforming three ways</title>
<!--
  MUST PASS, and it is the more important control of the three.

  A gate that only ever fails is a size ruler wearing a spec's name, and the first conforming
  pattern it wrongly reds gets it switched off. Each block below conforms under a DIFFERENT clause,
  so a green run here means all three are implemented rather than that nothing was measured:

    SIZE     — a 44x44 button.
    SPACING  — a 16x16 link with nothing within reach. Undersized and conforming; 2.5.8 says so.
    INLINE   — a small link in a sentence, the /watch repo-URL shape, which must be exempt WITHOUT
               a suppression. The paragraph holds prose either side of it.

  The nested case is here too: a 60x30 button inside a 300x200 card-link is a containment, not a
  collision, and reporting it would fire on every composite control on the real site.
-->
<style>
  body { margin: 0; padding: 20px; font: 16px/1.6 system-ui, sans-serif; }
  .big { width: 44px; height: 44px; }
  .lonely { display: block; width: 16px; height: 16px; background: #ddd; margin: 60px 0; }
  .card { display: block; position: relative; width: 300px; height: 200px; border: 1px solid #ccc; margin-top: 40px; }
  .card button { position: absolute; top: 20px; left: 20px; width: 60px; height: 30px; }
</style>
<button class="big">ok</button>
<a class="lonely" href="#lonely"></a>
<p>
  The office is the window, and the whole thing is built in the open at
  <a href="https://github.com/SandRiseStudio/musterd">the repository</a>, which is a small link
  sitting inside a real sentence with words either side of it.
</p>
<a class="card" href="#card"><button>act</button></a>
