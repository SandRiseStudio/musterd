name = "musterd-seeds-relay"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[observability]
enabled = true

# KV buffer — the source of record for captured seeds. Create with:
#   wrangler kv namespace create SEEDS_KV
# then paste the id below.
[[kv_namespaces]]
binding = "SEEDS_KV"
id = "58c05cfa4ea94dc5a1cf22476f98e665"

[vars]
ENABLE_TWILIO = "true"
ENABLE_SLACK = "true"
# Diagnostic notes (`debug:` prefix, 1h TTL, invisible to the daemon's `seed:` scan) recording that
# Slack delivered and what became of it. TURN THIS ON while wiring a channel: it is what makes an
# empty buffer stop being ambiguous between "never delivered" and "delivered and skipped", which are
# opposite fixes with identical symptoms. It earned that during the 2026-08-06 wiring — three
# separate silences (Socket Mode, a kicked bot membership, a revoked webhook) each looked the same
# from outside. Off in steady state: capture is proven, and a per-delivery KV write is a cost the
# happy path should not pay. `console.log` in recordSlackDelivery stays on either way.
SLACK_DEBUG = "false"
# The dedicated seeds channel (#musterd). Only its messages become seeds.
SLACK_SEEDS_CHANNEL = "C0BNGM9CBU4"

# Secrets (set via: wrangler secret put <NAME>):
# - TWILIO_AUTH_TOKEN     Twilio auth token (HMAC key for x-twilio-signature)
# - SLACK_SIGNING_SECRET  Slack app signing secret (v0 request signing)
# - SLACK_WEBHOOK_URL     incoming webhook for the "🌱 saved" confirmation (ADR 149 webhook)
# - PULL_TOKEN            bearer token the musterd daemon presents on GET /seeds
